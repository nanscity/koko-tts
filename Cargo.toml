[package]
name = "koko-tts"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Graphics_Gdi",
] }
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
ort = "2.0.0-rc.15"
ndarray = "0.17"
misaki-rs = { version = "0.3.0", default-features = false }
rodio = "0.19"
ureq = "3.5"
parking_lot = "0.12"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winres = "0.1.12"
